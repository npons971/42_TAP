# Original Dev B design snapshot. Runtime source of truth: data/world.json.
# The server does not load this YAML; edit data/world.json for gameplay changes.
world:
  metadata:
    name: "The Answer Protocol Realm"
    version: "1.0.0"
    start_room: "loc.town_square"
    respawn_room: "loc.town_square"

  locations:
    loc.town_square:
      name: "Village Square"
      description: "A bustling cobblestone square bathed in gentle sunlight. In the center stands a weathered stone fountain where fresh water trickles steadily. Adventurers frequently gather here before setting out."
      exits:
        east: "loc.market"
        north: "loc.garden"
        west: "loc.dark_alley"
      items:
        - "item.apple"
        - "item.fountain"
      spawns:
        - npc_id: "npc.guard"
          count: 1

    loc.market:
      name: "Central Market"
      description: "A vibrant market street lined with colorful merchant stalls, fragrant spice sacks, and stacks of handcrafted goods. The scent of baked bread and ripe fruits fills the air."
      exits:
        west: "loc.town_square"
        north: "loc.tavern"
        east: "loc.ruins_gate"
      items: []
      spawns:
        - npc_id: "npc.merchant"
          count: 1

    loc.tavern:
      name: "The Slumbering Dragon Tavern"
      description: "A warm and lively tavern illuminated by a roaring hearth fire. Sturdy oak tables are scattered across creaking floorboards, and a heavy wooden trapdoor leads down into the cellar."
      exits:
        south: "loc.market"
        west: "loc.dark_alley"
        down: "loc.cellar"
      items:
        - "item.ale"
      spawns:
        - npc_id: "npc.innkeeper"
          count: 1

    loc.dark_alley:
      name: "Dark Alley"
      description: "A narrow, shadow-drenched alleyway wedged between imposing brick buildings. The damp cobblestones are slippery, and a rusty iron sewer grating lies open in the corner."
      exits:
        south: "loc.town_square"
        east: "loc.tavern"
        down: "loc.sewers"
      items: []
      spawns:
        - npc_id: "npc.thief"
          count: 1

    loc.cellar:
      name: "Tavern Cellar"
      description: "A cool, dimly lit cellar lined with towering vintage wine barrels and dusty racks. Cobwebs hang thick from the wooden ceiling beams, and a secret arched passage extends to the south."
      exits:
        up: "loc.tavern"
        south: "loc.sewers"
      items:
        - "item.torch"
        - "item.vigor_potion"
      spawns: []

    loc.sewers:
      name: "Damp Sewers"
      description: "An echoing subterranean channel of sluggish murky water with slippery stone walkways on either side. Faint scuttling sounds echo through the darkness."
      exits:
        north: "loc.cellar"
        up: "loc.dark_alley"
      items:
        - "item.rare_herbs"
      spawns:
        - npc_id: "npc.giant_rat"
          count: 1

    loc.ruins_gate:
      name: "Ruins Gate"
      description: "A crumbling stone archway standing at the threshold of ancient forgotten fortifications. Overgrown thorn bushes wrap tightly around cracked masonry, and cold mountain winds whistle through the breach."
      exits:
        west: "loc.market"
        north: "loc.ruins_den"
      items:
        - "item.wooden_shield"
      spawns:
        - npc_id: "npc.guard_captain"
          count: 1

    loc.ruins_den:
      name: "Cutthroat's Den"
      description: "A fortified hideout established beneath the fractured vault of an ancient bastion. Stolen crates and plundered supplies surround a smoldering campfire. An air of imminent danger hangs heavy."
      exits:
        south: "loc.ruins_gate"
      items:
        - "item.mystery_chest"
      spawns:
        - npc_id: "npc.bandit_leader"
          count: 1

    loc.garden:
      name: "Overgrown Garden"
      description: "A peaceful, secluded enclave of wild greenery where nature has reclaimed old garden beds. Rare medicinal plants and flowering shrubs thrive under the canopy of weeping willows."
      exits:
        south: "loc.town_square"
      items:
        - "item.rusty_sword"
        - "item.ancient_key"
      spawns:
        - npc_id: "npc.herbalist"
          count: 1

  items:
    item.apple:
      name: "Fresh Apple"
      description: "A crisp, sweet red apple. Looks delicious and restores 10 HP when consumed."
      obtainable: true
      type: "consumable"
      heal_value: 10

    item.ale:
      name: "Frothy Ale"
      description: "A tall wooden mug filled with foamy, refreshing tavern ale. Restores 15 HP."
      obtainable: true
      type: "consumable"
      heal_value: 15

    item.rusty_sword:
      name: "Rusty Sword"
      description: "An old iron blade with a weathered leather hilt. Though notched and rusted, it grants +10 attack damage."
      obtainable: true
      type: "weapon"
      damage_bonus: 10

    item.torch:
      name: "Wooden Torch"
      description: "A pitch-soaked wooden torch wrapped in heavy burlap. Provides warmth and illumination in dark chambers."
      obtainable: true
      type: "tool"

    item.wooden_shield:
      name: "Battered Shield"
      description: "A sturdy wooden round shield reinforced with iron bands. Increases defense by 5."
      obtainable: true
      type: "armor"
      defense_bonus: 5

    item.rare_herbs:
      name: "Rare Herbs"
      description: "A fragrant bundle of silver-veined leaves sought by healers for their potent restorative properties."
      obtainable: true
      type: "quest"

    item.mystery_chest:
      name: "Heavy Iron Chest"
      description: "A massive reinforced chest bound with rusted iron bands. It is anchored to the stone floor and cannot be picked up."
      obtainable: false
      type: "scenery"

    item.fountain:
      name: "Stone Fountain"
      description: "An ornate carved fountain pouring crystal-clear spring water. It is a permanent architectural monument."
      obtainable: false
      type: "scenery"

    item.ancient_key:
      name: "Ancient Key"
      description: "An intricate brass key engraved with arcane runes, awarded for defeating the bandit leader."
      obtainable: true
      type: "quest_reward"

    item.vigor_potion:
      name: "Vigor Potion"
      description: "A glowing emerald flask brewed by the village herbalist. Restores health to maximum."
      obtainable: true
      type: "consumable"
      heal_value: 100

  npcs:
    npc.guard:
      name: "Village Guard"
      role: "dialogue"
      description: "A vigilant town guard clad in chainmail, keeping watch over the square."
      hp: 50
      max_hp: 50
      attack_power: 12
      hostile: false
      dialogue:
        - "Stay on your guard, traveler. The outer ruins have grown lawless."
        - "The herbalist in the northern garden might need help gathering supplies."
        - "Don't cause any trouble within the village gates."

    npc.innkeeper:
      name: "Jovial Innkeeper"
      role: "dialogue"
      description: "A plump, cheerful man vigorously wiping down the wooden tavern bar with a clean rag."
      hp: 30
      max_hp: 30
      attack_power: 5
      hostile: false
      dialogue:
        - "Welcome to The Slumbering Dragon! Pull up a chair and rest your boots."
        - "Careful if you head down to the cellar—the old sewer connection isn't sealed."
        - "Nothing warms the soul like a pint of frothy ale."

    npc.merchant:
      name: "Traveling Merchant"
      role: "dialogue"
      description: "A well-traveled merchant displaying wares from distant provinces."
      hp: 35
      max_hp: 35
      attack_power: 6
      hostile: false
      dialogue:
        - "Looking for fresh produce or sturdy traveling supplies?"
        - "Bandits out by the eastern gates have disrupted my trade caravans."
        - "Take an apple for the road, traveler."

    npc.thief:
      name: "Shady Cutpurse"
      role: "dialogue"
      description: "A cloaked figure lurking in the shadows, fingering a rusted dagger."
      hp: 30
      max_hp: 30
      attack_power: 8
      hostile: false
      dialogue:
        - "Keep moving, stranger. Nothing to see here."
        - "Watch your coin pouch in dark alleys like this one."

    npc.herbalist:
      name: "Village Herbalist"
      role: "quest_giver"
      description: "A knowledgeable apothecary tending to fragrant herbs with gentle care."
      hp: 25
      max_hp: 25
      attack_power: 2
      hostile: false
      dialogue:
        - "Greetings, traveler. I am preparing remedies for the injured guards, but my stock of rare herbs is depleted."
        - "The overgrown garden behind the square holds rare medicinal herbs. Could you bring some to me?"

    npc.guard_captain:
      name: "Guard Captain"
      role: "quest_giver"
      description: "A battle-hardened officer standing guard before the gate leading to the ancient ruins."
      hp: 75
      max_hp: 75
      attack_power: 18
      hostile: false
      dialogue:
        - "Halt! Beyond these gates lies the bandit hideout in the old ruins."
        - "A sizable bounty awaits any brave adventurer who eliminates the Bandit Leader."

    npc.giant_rat:
      name: "Giant Sewer Rat"
      role: "enemy"
      description: "A foul, bloated rodent with sharp yellow incisors and glistening red eyes."
      hp: 20
      max_hp: 20
      attack_power: 6
      hostile: true
      dialogue:
        - "The giant rat hisses aggressively, baring sharp yellow teeth!"

    npc.bandit_leader:
      name: "Bandit Leader"
      role: "enemy"
      description: "A scar-faced cutthroat armed with twin notched scimitars, ruling the ruins."
      hp: 70
      max_hp: 70
      attack_power: 20
      hostile: true
      dialogue:
        - "You dare infiltrate my hideout? You won't leave these ruins alive!"

  quests:
    quest.herbal_cure:
      title: "The Apothecary's Remedy"
      giver: "npc.herbalist"
      description: "Collect rare medicinal herbs from the overgrown garden and deliver them to the village herbalist."
      type: "fetch_and_deliver"
      target_item: "item.rare_herbs"
      target_npc: "npc.herbalist"
      reward_item: "item.vigor_potion"
      reward_hp_heal: 100
      completion_dialogue: "You found them! These will save many lives. Please take this Vigor Potion as a token of my gratitude."

    quest.bandit_bounty:
      title: "Bounty on the Cutthroat"
      giver: "npc.guard_captain"
      description: "Venture into the ancient ruins and defeat the notorious Bandit Leader threatening the region."
      type: "defeat_and_report"
      target_npc_defeat: "npc.bandit_leader"
      target_npc_report: "npc.guard_captain"
      reward_item: "item.ancient_key"
      completion_dialogue: "Outstanding work! The roads are safe once again. Here is the Ancient Key to the stronghold crypt."
